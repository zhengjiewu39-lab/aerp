services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      AERP_DATABASE_URL: sqlite:///data/aerp.db
      AERP_AUTO_SEED: "true"
      AERP_DEMO_SEED: "42"
      AERP_HOST: 0.0.0.0
      AERP_PORT: "8000"
      AERP_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    volumes:
      - ./data:/app/data
    # Docker 不是唯一运行方式；本地请优先使用 README 中的 uv/npm 启动。
