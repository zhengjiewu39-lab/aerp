[project]
name = "aerp"
version = "0.2.0"
description = "Adaptive Epidemic Research Platform — local research prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "pandas>=2.2.3,<2.3",
  "numpy>=2.1,<2.3",
  "scipy>=1.14.1,<1.15",
  "scikit-learn>=1.5,<1.7",
  "statsmodels>=0.14.4,<0.15",
  "python-multipart>=0.0.18,<0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aerp*"]

[tool.setuptools.package-data]
aerp = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
